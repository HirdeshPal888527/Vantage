name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  stats-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r stats/requirements.txt
      - name: Run statistical validation
        run: python stats/validate.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint tools
        run: pip install ruff
      - name: Ruff check
        run: ruff check api stats dashboard

  build:
    runs-on: ubuntu-latest
    needs: [stats-validate, lint]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t exp-api:ci -f api/Dockerfile .
      - name: Build dashboard image
        run: docker build -t exp-dashboard:ci ./dashboard

  smoke-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Boot full stack
        run: docker compose up -d --build
      - name: Wait for API health
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8001/health; then exit 0; fi
            sleep 5
          done
          echo "API did not become healthy in time" && exit 1
      - name: Tear down
        if: always()
        run: docker compose down -v
